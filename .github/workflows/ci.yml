name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway CI-only credentials for the ephemeral service container.
  CI_PG_PASSWORD: ci-only-not-a-secret

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentineltrace
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: sentineltrace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentineltrace" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ST_DATABASE_URL: postgresql+psycopg://sentineltrace:ci-only-not-a-secret@127.0.0.1:5432/sentineltrace_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentineltrace
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: sentineltrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentineltrace" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      ST_DATABASE_URL: postgresql+psycopg://sentineltrace:ci-only-not-a-secret@127.0.0.1:5432/sentineltrace
      E2E_ADMIN_USER: ci-admin
      E2E_ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Migrate, seed admin, start backend
        working-directory: backend
        env:
          ST_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
        run: |
          uv sync --frozen --no-dev
          uv run --no-dev alembic upgrade head
          uv run --no-dev python -m app.cli create-admin --username "$E2E_ADMIN_USER"
          nohup uv run --no-dev uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/ready && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/api/ready
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            frontend/playwright-report
            backend.log

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: |
          echo "ST_PG_PASSWORD=$CI_PG_PASSWORD" > .env
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
      - name: Check health through the frontend proxy
        run: |
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/api/ready
          curl -fsS http://127.0.0.1:8080/ | grep -q "<title>SentinelTrace</title>"
      - name: Migrations applied; create admin and log in through nginx
        run: |
          docker compose exec -T -e ST_ADMIN_PASSWORD=ci-only-admin-password backend \
            python -m app.cli create-admin --username ci-admin
          code=$(curl -s -o /dev/null -w '%{http_code}' -c jar.txt -H 'Content-Type: application/json' \
            -d '{"username":"ci-admin","password":"ci-only-admin-password"}' \
            http://127.0.0.1:8080/api/auth/login)
          test "$code" = 200
          curl -fsS -b jar.txt http://127.0.0.1:8080/api/auth/me | grep -q '"role":"admin"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/users)" = 401
      - if: always()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
