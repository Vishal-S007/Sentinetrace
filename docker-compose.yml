# SentinelTrace local stack. Copy .env.example to .env and set ST_PG_PASSWORD first.
#   docker compose up --build
# App: http://localhost:8080   API docs: http://localhost:8080/api/docs
# First run: create an admin account:
#   docker compose exec backend python -m app.cli create-admin --username admin
name: sentineltrace

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentineltrace
      POSTGRES_DB: sentineltrace
      POSTGRES_PASSWORD: ${ST_PG_PASSWORD:?Set ST_PG_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentineltrace -d sentineltrace"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host by default; uncomment for local DB tools.
    # ports: ["127.0.0.1:5432:5432"]

  backend:
    build: ./backend
    environment:
      ST_ENVIRONMENT: ${ST_ENVIRONMENT:-development}
      ST_DATABASE_URL: postgresql+psycopg://sentineltrace:${ST_PG_PASSWORD}@db:5432/sentineltrace
      ST_MAX_UPLOAD_BYTES: ${ST_MAX_UPLOAD_BYTES:-52428800}
      ST_EXPORT_RATE_PER_MINUTE: ${ST_EXPORT_RATE_PER_MINUTE:-}
      ST_RETENTION_MIN_DAYS: ${ST_RETENTION_MIN_DAYS:-}
      # Shown on the privacy policy, so the backend needs the same values as the worker.
      ST_RETENTION_AUTO_DAYS: ${ST_RETENTION_AUTO_DAYS:-}
      ST_LOGIN_ATTEMPT_RETENTION_DAYS: ${ST_LOGIN_ATTEMPT_RETENTION_DAYS:-}
      ST_SESSION_RETENTION_DAYS: ${ST_SESSION_RETENTION_DAYS:-}
      # Who runs this instance: shown on the privacy policy, terms and cookie policy.
      ST_OPERATOR_NAME: ${ST_OPERATOR_NAME:-}
      ST_OPERATOR_CONTACT: ${ST_OPERATOR_CONTACT:-}
      ST_OPERATOR_ADDRESS: ${ST_OPERATOR_ADDRESS:-}
      ST_LEGAL_EFFECTIVE_DATE: ${ST_LEGAL_EFFECTIVE_DATE:-}
      # Set to true when the app is served over HTTPS (required in production).
      ST_COOKIE_SECURE: ${ST_COOKIE_SECURE:-false}
      # The backend is reachable only from the nginx container on the internal network,
      # so it trusts X-Forwarded-For from it (needed for per-IP login rate limiting).
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  # Processes queued ingestion jobs (parsing + persisting events). Scale with --scale worker=N.
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      ST_ENVIRONMENT: ${ST_ENVIRONMENT:-development}
      ST_DATABASE_URL: postgresql+psycopg://sentineltrace:${ST_PG_PASSWORD}@db:5432/sentineltrace
      ST_WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
      # Optional: purge data older than N days once a day (see README "Data retention").
      ST_RETENTION_AUTO_DAYS: ${ST_RETENTION_AUTO_DAYS:-}
      ST_RETENTION_MIN_DAYS: ${ST_RETENTION_MIN_DAYS:-}
      # The worker deletes old sign-in records hourly using these periods.
      ST_LOGIN_ATTEMPT_RETENTION_DAYS: ${ST_LOGIN_ATTEMPT_RETENTION_DAYS:-}
      ST_SESSION_RETENTION_DAYS: ${ST_SESSION_RETENTION_DAYS:-}
    volumes:
      - storage:/app/storage
    depends_on:
      backend:
        condition: service_healthy  # migrations have run
    # Healthy while the worker loop keeps reaching the database (heartbeat file age).
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check-health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  storage:
